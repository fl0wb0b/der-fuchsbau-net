# Instagram-Sync: kopiert täglich die neuesten Posts als lokale Bilder
# in gallery/. Kein Token nötig — die Behold-Feed-URL ist öffentlich
# und zeigt nur, was auf dem Instagram-Profil ohnehin öffentlich ist.
#
# Einrichtung: FEED_URL unten eintragen (https://feeds.behold.so/…).
# Solange sie leer ist, macht der Lauf nichts.

name: Instagram-Sync

on:
  schedule:
    - cron: "23 3 * * *"   # täglich 03:23 UTC — bewusst nicht zur vollen Stunde
  workflow_dispatch: {}     # manueller Start über den Actions-Tab

permissions:
  contents: write

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FEED_URL: "https://feeds.behold.so/LgF2Ep66rtknBcqlYMEZ"
      GOOGLE_PLACE_ID: ""   # <-- Place-ID des Maps-Eintrags (öffentlich)
      GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}  # API-Schlüssel: nur im Secrets-Tresor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install --quiet requests pillow

      - name: Instagram-Feed holen und Bilder verarbeiten
        run: python scripts/instagram_sync.py

      - name: Google-Bewertungen holen
        run: python scripts/reviews_sync.py

      - name: Änderungen committen
        run: |
          git config user.name "fuchsbau-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A gallery/ reviews.json 2>/dev/null || git add -A gallery/
          if git diff --cached --quiet; then
            echo "Keine Änderungen — kein Commit."
          else
            git commit -m "Sync: Instagram-Fotos / Google-Bewertungen aktualisiert"
            git push
          fi
