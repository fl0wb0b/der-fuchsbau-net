<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Der Fuchsbau · Kindertagespflege</title>
<meta name="description" content="Der Fuchsbau – liebevolle Kindertagespflege in Hungen. Wir sind bald für euch da.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --fox:      #D4622A;
    --fox-dk:   #8B3A1A;
    --fox-lt:   #F2A96E;
    --fox-pale: #FEF4EC;
    --cream:    #FBF7F2;
    --bark:     #2C1F14;
    --mid:      #7A6050;
    --light:    #B8A090;
    --border:   rgba(44,31,20,.1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--bark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: #fff;
    border-radius: 2rem;
    box-shadow: 0 20px 60px rgba(44,31,20,.12);
    max-width: 460px;
    width: 100%;
    text-align: center;
  }

  .card-body {
    padding: 2.5rem 2.5rem 3rem;
  }

  /* Runder Rahmen – Best Practice */
  .fox-avatar {
    width: 200px;
    height: 200px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    /* Doppelter Ring: innen fox-pale, außen fox-Farbe */
    outline: 4px solid var(--fox);
    outline-offset: 4px;
    box-shadow:
      0 0 0 8px var(--fox-pale),   /* weicher Puffer-Ring */
      0 12px 40px rgba(212,98,42,.25); /* warmer Schatten */
    overflow: hidden;
    background: var(--fox-pale);
    /* verhindert Kantenflimmern auf Retina */
    transform: translateZ(0);
  }

  .fox-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Bildausschnitt: Fuchs ist oben-mittig im Bild */
    object-position: center 50%;
    display: block;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    font-weight: 800;
    color: var(--bark);
    line-height: 1.2;
    margin-bottom: .3rem;
  }

  h1 span {
    color: var(--fox);
    font-style: italic;
  }

  .subtitle {
    font-size: .95rem;
    color: var(--mid);
    margin-bottom: 0;
    font-weight: 300;
    letter-spacing: .04em;
    text-transform: uppercase;
    font-size: .8rem;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.6rem 0;
  }

  .message {
    font-size: 1.05rem;
    color: var(--mid);
    line-height: 1.7;
    margin-bottom: 2rem;
  }

  .message strong {
    color: var(--bark);
    font-weight: 600;
  }

  .wa-btn {
    display: inline-flex;
    align-items: center;
    gap: .7rem;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    padding: .9rem 2rem;
    border-radius: 3rem;
    transition: background .2s, transform .15s, box-shadow .2s;
    box-shadow: 0 4px 16px rgba(37,211,102,.3);
  }

  .wa-btn:hover {
    background: #1fba58;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(37,211,102,.4);
  }

  .wa-btn svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  .footer {
    margin-top: 2rem;
    font-size: .8rem;
    color: var(--light);
  }

  .footer a {
    color: var(--light);
    text-decoration: none;
  }

  .footer a:hover { color: var(--mid); }

  @media (max-width: 480px) {
    .card-body { padding: 2rem 1.5rem 2.5rem; }
    h1 { font-size: 1.6rem; }
    .fox-avatar { width: 160px; height: 160px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-body">
    <div class="fox-avatar">
      <img src="fuchs.jpg" alt="Mama-Fuchs mit ihren Jungen – Der Fuchsbau">
    </div>
    <h1>Der <span>Fuchsbau</span></h1>
    <p class="subtitle">Kindertagespflege</p>

    <hr class="divider">

    <p class="message">
      Unsere neue Website ist noch im Aufbau.<br>
      <strong>Wir sind bald für euch da!</strong><br><br>
      Bis dahin könnt ihr uns einfach direkt über WhatsApp erreichen.
    </p>

    <a class="wa-btn" href="https://wa.me/491627820602" target="_blank" rel="noopener">

  </div>
</div>

</body>
</html>
